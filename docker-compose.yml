  # Data Initialization - Populate sample Iceberg tables
  data-init:
    build:
      context: ./init-data
      dockerfile: Dockerfile
    environment:
      LAKEKEEPER_URI: http://lakekeeper:8181
      LAKEKEEPER_WAREHOUSE: datalake-warehouse
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: datalake
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: admin123
      S3_REGION: us-east-1
    depends_on:
      lakekeeper:
        condition: service_healthy
      create-s3-bucket:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - datalake-network
    profiles:
      - init

