services:
  # Fix RustFS volume permissions
  rustfs-permissions:
    image: alpine:latest
    command: sh -c "chown -R 10001:10001 /data/rustfs0 /data/rustfs1"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
    restart: "no"
    networks:
      - datalake-network

  # RustFS - S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console/web interface
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...1}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin123
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBJECT_CACHE_ENABLE: "false"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
    networks:
      - datalake-network
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 3

  # Create S3 bucket - Initializes the datalake bucket
  create-s3-bucket:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for S3 service to be ready..."
        sleep 5
        echo "Creating datalake bucket..."
        aws --endpoint-url=http://rustfs:9000 s3 mb s3://datalake || echo "Bucket might already exist"
        echo "Bucket creation complete!"
        aws --endpoint-url=http://rustfs:9000 s3 ls
    networks:
      - datalake-network

  # PostgreSQL - LakeKeeper metadata storage
  postgres-catalog:
    image: postgres:16
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper123
      POSTGRES_DB: lakekeeper
    ports:
      - "5433:5432"
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    networks:
      - datalake-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LakeKeeper Migration - Run database migrations
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure-Change-Me!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://lakekeeper:lakekeeper123@postgres-catalog:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://lakekeeper:lakekeeper123@postgres-catalog:5432/lakekeeper"
      RUST_LOG: "info"
    command: ["migrate"]
    depends_on:
      postgres-catalog:
        condition: service_healthy
    restart: "no"
    networks:
      - datalake-network

  # LakeKeeper - Iceberg REST Catalog
  # UI available at: http://localhost:8181/ui/
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure-Change-Me!"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://lakekeeper:lakekeeper123@postgres-catalog:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://lakekeeper:lakekeeper123@postgres-catalog:5432/lakekeeper"
      RUST_LOG: "info"
    command: ["serve"]
    ports:
      - "8181:8181"  # REST API + UI
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres-catalog:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - datalake-network
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Bootstrap LakeKeeper - Initialize the catalog
  lakekeeper-bootstrap:
    image: curlimages/curl
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    command:
      - -w
      - "%{http_code}"
      - "-v"
      - "http://lakekeeper:8181/management/v1/bootstrap"
      - "-H"
      - "Content-Type: application/json"
      - "--data"
      - '{"accept-terms-of-use": true}'
      - "-o"
      - "/dev/null"
    networks:
      - datalake-network

  # Trino - Lightweight query engine with native Iceberg support
  # Reached externally only via Caddy (https://trino.datalake.local) — see the `caddy` service.
  trino:
    build:
      context: ./trino
      dockerfile: Dockerfile
    environment:
      TRINO_USER: ${TRINO_USER:-trino}
      TRINO_PASSWORD: ${TRINO_PASSWORD:-trino}
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:-change-this-shared-secret}
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    networks:
      - datalake-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Caddy - TLS-terminating reverse proxy with a static internal CA,
  # fronting Trino (trino.datalake.local) and Keycloak (auth.datalake.local).
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/pki:/pki:ro
      - caddy-data:/data
    depends_on:
      trino:
        condition: service_healthy
    networks:
      datalake-network:
        # Let in-network services (e.g. Superset) reach Trino over Caddy's TLS
        # edge under the same hostname external clients use.
        aliases:
          - trino.datalake.local

  # Gateway certificates - Issues the PostgreSQL listener certificate from the
  # same local root CA that fronts Trino, so clients trust a single CA.
  # The gateway refuses `--auth` on a non-loopback bind without TLS.
  gateway-certs:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/tls.crt ] && [ -f /certs/tls.key ]; then
          echo "Gateway certificate already present — leaving it untouched."
          exit 0
        fi
        echo "Issuing gateway certificate for ${GATEWAY_HOSTNAME:-trino-gateway.datalake.local} ..."
        openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
          -CA /pki/root.pem -CAkey /pki/root.key \
          -keyout /certs/tls.key -out /certs/tls.crt \
          -subj "/CN=${GATEWAY_HOSTNAME:-trino-gateway.datalake.local}" \
          -addext "subjectAltName=DNS:${GATEWAY_HOSTNAME:-trino-gateway.datalake.local},DNS:localhost,IP:127.0.0.1" \
          -addext "basicConstraints=critical,CA:FALSE" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage=serverAuth"
        # The gateway runs as a non-root user that shares no group with this container.
        chmod 644 /certs/tls.key /certs/tls.crt
    restart: "no"
    volumes:
      - ./caddy/pki:/pki:ro
      - gateway-certs:/certs
    networks:
      - datalake-network

  # PostgreSQL-Trino Gateway - PostgreSQL wire-protocol shim in front of Trino,
  # for clients that only speak PostgreSQL (e.g. Power BI DirectQuery).
  # Built from https://github.com/stackabletech/postgresql-trino-gateway
  #
  # Auth: `--auth` issues a cleartext password challenge to the PG client (over
  # the listener's TLS) and forwards those credentials to Trino as HTTP Basic
  # auth. Trino only accepts password auth over TLS, so the gateway reaches it
  # through Caddy's edge; Caddy's internal CA is not in the image's trust store,
  # hence `--trino-tls-no-verify` on this trusted internal network.
  postgresql-trino-gateway:
    build:
      context: https://github.com/stackabletech/postgresql-trino-gateway.git#main
      dockerfile: docker/Dockerfile
    image: postgresql-trino-gateway:latest
    ports:
      - "5432:5432"
    environment:
      RUST_LOG: ${GATEWAY_LOG_LEVEL:-postgresql_trino_gateway=info}
    command:
      - --listen-addr=0.0.0.0:5432
      - --tls-cert=/certs/tls.crt
      - --tls-key=/certs/tls.key
      - --auth
      - --trino-host=trino.datalake.local
      - --trino-port=443
      - --trino-ssl
      - --trino-tls-no-verify
      - --trino-catalog=${GATEWAY_TRINO_CATALOG:-iceberg}
      - --trino-schema=${GATEWAY_TRINO_SCHEMA:-demo}
    volumes:
      - gateway-certs:/certs:ro
    depends_on:
      gateway-certs:
        condition: service_completed_successfully
      caddy:
        condition: service_started
    networks:
      - datalake-network

  # Superset - Data visualization and exploration platform
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "change-this-in-production"
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset-data:/app/superset_home
      - ./superset/init-superset.sh:/app/docker-init.sh:ro
      # Caddy's internal root CA, so Superset can verify the TLS edge in front of Trino.
      - ./caddy/pki/root.pem:/etc/ssl/datalake/root.pem:ro
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - datalake-network
    command: ["/bin/sh", "-c", "/app/docker-init.sh && /usr/bin/run-server.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Data Initialization - Populate sample Iceberg tables
  data-init:
    build:
      context: ./init-data
      dockerfile: Dockerfile
    environment:
      LAKEKEEPER_URI: http://lakekeeper:8181
      LAKEKEEPER_WAREHOUSE: datalake-warehouse
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: datalake
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: admin123
      S3_REGION: us-east-1
    depends_on:
      lakekeeper:
        condition: service_healthy
      create-s3-bucket:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - datalake-network
    profiles:
      - init

networks:
  datalake-network:
    driver: bridge

volumes:
  rustfs-data-0:
  rustfs-data-1:
  postgres-catalog-data:
  superset-data:
  caddy-data:
  gateway-certs:
