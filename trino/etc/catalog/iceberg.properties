# Iceberg Connector Configuration
# Connects to LakeKeeper REST catalog with credential vending

connector.name=iceberg

# REST Catalog Configuration
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=datalake-warehouse
# To investigate how to make vended credentials work
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.rest-catalog.view-endpoints-enabled=false
iceberg.security=ALLOW_ALL

# S3 Configuration
fs.native-s3.enabled=true
s3.path-style-access=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.aws-access-key=admin
s3.aws-secret-key=admin123
