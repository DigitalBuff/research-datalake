# Trino Configuration
# Lightweight single-node configuration for PoC

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# External authentication (PoC step 0: password over Caddy's TLS edge)
# Trino trusts the X-Forwarded-Proto header set by Caddy instead of terminating TLS itself.
http-server.authentication.type=PASSWORD
http-server.process-forwarded=true

# Required once any http-server.authentication.type is set, even single-node.
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# Memory settings - tuned for lightweight operation
query.max-length=1000000
query.max-memory=872MB
query.max-memory-per-node=872MB
query.max-total-memory=1000MB
memory.heap-headroom-per-node=128MB

# Query history and expiry settings - reduced for minimal footprint
query.max-history=20
query.min-expire-age=1s
